
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'dbt_mimic_omop'
version: '0.1.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'dbt_mimic_omop'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

models:
  dbt_mimic_omop:
    silver:
      +schema: silver
      +materialized: view
      # these are materialised as tables due to memory restrictions
      # this can be removed with enough available memory and will free up disk space
      microbiologyevents:
        int__lk_specimen_mapped:
          +materialized: table
        int__lk_meas_organism_mapped:
          +materialized: table
        int__lk_meas_ab_mapped:
          +materialized: table
      admissions:
        int__lk_visit_clean:
          +materialized: table
      measurement:
        int__measurement:
          +materialized: table
        int__measurement_id_map:
          +materialized: table
      # MIMIC-CXR imaging models
      mimic_cxr:
        +tags: ['mimic_cxr']
        # Intermediate models materialized as tables for performance
        int__imaging_visit_linked:
          +materialized: table
        int__imaging_features_pivoted:
          +materialized: table
    gold:
      +schema: gold
      +materialized: table