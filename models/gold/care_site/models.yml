version: 2

models:
  - name: care_site
    description: >
      The CARE_SITE table contains a list of uniquely identified institutional 
      (physical or organizational) units where healthcare delivery is practiced 
      (offices, wards, hospitals, clinics, etc.).

    config:
      contract:
        enforced: true

    columns:
      - name: care_site_id
        data_type: INT
        description: Unique identifier for each care site in the dataset.
        tests:
          - not_null
          - unique

      - name: care_site_name
        data_type: VARCHAR(255)
        description: Name of the care site. 

      - name: place_of_service_concept_id
        data_type: INT
        description: High level characterization of type of care site based on OMOP concepts.

      - name: location_id
        data_type: INT
        description: Foreign key to the LOCATION table, indicating the physical location of the care site.

      - name: care_site_source_value
        data_type: VARCHAR(50)
        description: Source value for the care site, typically derived from the original data source.

      - name: place_of_service_source_value
        data_type: VARCHAR(50)
        description: Place of service, as it appears in source data.