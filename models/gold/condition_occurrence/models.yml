version: 2

models:
  - name: condition_occurrence
    description: >
      This table contains records of Events of a Person suggesting the presence of a disease 
      or medical condition stated as a diagnosis, a sign, or a symptom, which is either 
      observed by a Provider or reported by the patient.

    config:
      contract:
        enforced: true

    columns:
      - name: condition_occurrence_id
        data_type: INT
        description: The unique key given to a condition record for a person.
        tests:
          - not_null
          - unique

      - name: person_id
        data_type: INT
        description: Persons identifier.
        tests:
          - not_null

      - name: condition_concept_id
        data_type: INT
        description: The CONDITION_CONCEPT_ID field is recommended for primary use in analyses.
        tests:
          - not_null

      - name: condition_start_date
        data_type: date
        description: Use this date to determine the start date of the condition.
        tests:
          - not_null

      - name: condition_start_datetime
        data_type: datetime
        description: If no time is given for the start date of a condition, set it to midnight (00:00:0000). 

      - name: condition_end_date
        data_type: date
        description: Use this date to determine the end date of the condition 

      - name: condition_end_datetime
        data_type: datetime
        description: If ongoing set the end date to the current date.

      - name: condition_type_concept_id
        data_type: INT
        description: Source of condition record - i.e. EHR, claims, etc.
        tests:
          - not_null

      - name: condition_status_concept_id
        data_type: INT
        description: The point during the visit the diagnosis was given (admitting diagnosis, final diagnosis)

      - name: stop_reason
        data_type: VARCHAR(20)
        description: Why a Condition is no longer valid with respect to the purpose within the source data. 

      - name: provider_id
        data_type: INT
        description: There will only be one provider per condition record, choice has to be made.

      - name: visit_occurrence_id
        data_type: INT
        description: The visit during which the condition occurred. 

      - name: visit_detail_id
        data_type: INT
        description: The VISIT_DETAIL record during which the condition occurred.

      - name: condition_source_value
        data_type: VARCHAR(50)
        description: Value from the source data representing the condition that occurred.

      - name: condition_source_concept_id
        data_type: INT
        description: Value from the source data representing the condition that occurred.

      - name: condition_status_source_value
        data_type: INT
        description: Value from the source data representing the condition status. 