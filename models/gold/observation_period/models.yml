version: 2

models:
  - name: observation_period
    description: >
      This table contains records which define spans of time 
      during which two conditions are expected to hold: (i) 
      Clinical Events that happened to the Person are recorded 
      in the Event tables, and (ii) absence of records indicate 
      such Events did not occur during this span of time.

    config:
      contract:
        enforced: true

    columns:
      - name: observation_period_id
        data_type: INT
        description: Unique identifier for each observation
        tests:
          - not_null
          - unique

      - name: person_id
        data_type: INT
        description: Indicates the person
          whose observation period is described by this record.
        tests:
          - not_null

      - name: observation_period_start_date
        data_type: DATE
        description: Start date of the observation period.
        tests:
          - not_null

      - name: observation_period_end_date
        data_type: DATE
        description: End date of the observation period.
        tests:
          - not_null

      - name: period_type_concept_id
        data_type: INT
        description: Identifies the type of the observation period.
        tests:
          - not_null