version: 2

models:
  - name: procedure_occurrence
    description: >
      This table contains records of activities or processes ordered by, 
      or carried out by, a healthcare provider on the patient with a 
      diagnostic or therapeutic purpose.

    config:
      contract:
        enforced: true

    columns:
      - name: procedure_occurrence_id
        data_type: INT
        description: TThe unique key given to a procedure record for a person.
        tests:
          - not_null
          - unique

      - name: person_id
        data_type: INT
        description: Persons identifier.
        tests:
          - not_null

      - name: procedure_concept_id
        data_type: INT
        description: The PROCEDURE_CONCEPT_ID field is recommended for primary use in analyses.
        tests:
          - not_null

      - name: procedure_date
        data_type: date
        description: Use this date to determine the start date of the condition.
        tests:
          - not_null

      - name: procedure_datetime
        data_type: datetime
        description: If no time is given for the start date of a procedure, set it to midnight (00:00:0000). 

      - name: procedure_end_date
        data_type: date
        description: Use this date to determine the end date of the procedure.

      - name: procedure_end_datetime
        data_type: datetime
        description: Use this field to house the datetime that the procedure ended. 

      - name: procedure_type_concept_id
        data_type: INT
        description: Source of procedure record - i.e. EHR, claims, etc.
        tests:
          - not_null

      - name: modifier_concept_id
        data_type: INT
        description: Give additional information about the procedure.

      - name: quantity
        data_type: INT
        description: If the quantity value is omitted, a single procedure is assumed. 

      - name: provider_id
        data_type: INT
        description: There will only be one provider per procedure record, choice has to be made.

      - name: visit_occurrence_id
        data_type: INT
        description: The visit during which the procedure occurred. 

      - name: visit_detail_id
        data_type: INT
        description: The VISIT_DETAIL record during which the procedure occurred.

      - name: procedure_source_value
        data_type: VARCHAR(50)
        description: Value from the source data representing the procedure that occurred.

      - name: procedure_source_concept_id
        data_type: INT
        description: Value from the source data representing the procedure that occurred.

      - name: modifier_source_value
        data_type: VARCHAR(50)
        description: Value from the source data representing the procedure status. 