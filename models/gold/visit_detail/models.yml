version: 2

models:
  - name: visit_detail
    description: >
      The VISIT_DETAIL table is an optional table used to represents details 
      of each record in the parent VISIT_OCCURRENCE table.

    config:
      contract:
        enforced: true

    columns:
      - name: visit_detail_id
        data_type: BIGINT
        description: Unique interactions between a person and the health care system. 
        tests:
          - not_null
          - unique

      - name: person_id
        data_type: INT
        description: Persons identifier.
        tests:
          - not_null

      - name: visit_detail_concept_id
        data_type: BIGINT
        description: This field contains a concept id representing the kind of visit.
        tests:
          - not_null

      - name: visit_detail_start_date
        data_type: date
        description: For inpatient visits, the start date is typically the admission date.
        tests:
          - not_null

      - name: visit_detail_start_datetime
        data_type: datetime
        description: If no time is given for the start date of a visit, set it to midnight (00:00:0000). 

      - name: visit_detail_end_date
        data_type: date
        description: For outpatient visits the start date and end date will be the same. 
        tests:
          - not_null

      - name: visit_detail_end_datetime
        data_type: datetime
        description: If ongoing set the end date to the current date.

      - name: visit_detail_type_concept_id
        data_type: INT
        description: Standard concept id that identifies the type of visit detail record.
        tests:
          - not_null

      - name: provider_id
        data_type: BIGINT
        description: There will only be one provider per visit record, choose has to be made.

      - name: care_site_id
        data_type: BIGINT
        description: Care site where the visit took place.

      - name: visit_detail_source_value
        data_type: VARCHAR(50)
        description: Vertabim source value for the kind of visit.

      - name: visit_detail_source_concept_id
        data_type: BIGINT
        description: Concept id representing the source value here. 

      - name: admitted_from_concept_id
        data_type: BIGINT
        description: Use this field to determine where the patient was admitted from.

      - name: admitted_from_source_value
        data_type: VARCHAR(50)
        description: The source value for where the patient was admitted from.

      - name: discharged_to_concept_id
        data_type: BIGINT
        description: Use this field to determine where the patient was discharged to after a visit. 

      - name: discharged_to_source_value
        data_type: VARCHAR(50)
        description: The source value for where the patient was discharged to after a visit.

      - name: preceding_visit_detail_id
        data_type: BIGINT
        description: Use this field to find the visit detail that occurred for the person prior to the given visit detail record.

      - name: parent_visit_detail_id
        data_type: BIGINT
        description: Use this field to find the visit detail that subsumes the given visit detail record. 

      - name: visit_occurrence_id
        data_type: BIGINT
        description: Use this field to link the VISIT_DETAIL record to its VISIT_OCCURRENCE.
        tests:
          - not_null